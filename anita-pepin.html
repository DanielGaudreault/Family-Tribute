<h1>Anita Pépin</h1>

<div class="subtitle">
1939 – 2018<br>
Angliers, Québec
</div>

<p>
The Robert et Fils Funeral Home of Témiscamingue announced the passing
of Mrs. Anita Pépin of Angliers, beloved wife of the late Raymond
Gaudreault. She passed away on July 1, 2018, at the age of 78.
</p>

<p>
Family and friends gathered on September 1 at Saint-Viateur
Church in Angliers to celebrate her life and honor her memory.
Following the funeral service, she was laid to rest in the parish cemetery.
</p>

<div class="family">

</ul>

<p>
She is also remembered by many brothers-in-law,
sisters-in-law, nephews, nieces, relatives, and friends.
</p>

<p>
Anita was predeceased by her husband Raymond Gaudreault
and her sons Jacquelin and Sylvain.
</p>
