<title>Memorials | Gaudreault Family</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Segoe UI, Arial, sans-serif;
    background:#f5f7fa;
    color:#333;
}

.header{
    background:#1f2937;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 30px;
    flex-wrap:wrap;
}

.logo a{
    color:white;
    text-decoration:none;
    font-size:30px;
    font-weight:bold;
}

.logo a:hover{
    color:#60a5fa;
}

.nav{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.nav a{
    color:white;
    text-decoration:none;
    padding:10px 16px;
    border-radius:8px;
    transition:.3s;
}

.nav a:hover{
    background:#2563eb;
}

.hero{
    background:#6b7280;
    color:white;
    text-align:center;
    padding:80px 20px;
}

.hero h1{
    font-size:48px;
}

.hero p{
    margin-top:10px;
    font-size:18px;
}

.grid{
    max-width:1200px;
    margin:auto;
    padding:40px 20px;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:25px;
}

.card{
    background:white;
    border-radius:20px;
    overflow:hidden;
    text-decoration:none;
    color:#333;

    box-shadow:0 4px 15px rgba(0,0,0,.1);

    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card img{
    width:100%;
    height:350px;
    object-fit:cover;
}

.card-content{
    padding:20px;
    text-align:center;
}

.card-content h2{
    margin-bottom:10px;
}

.card-content p{
    margin-bottom:8px;
}

footer{
    background:#1f2937;
    color:white;
    text-align:center;
    padding:20px;
}

</style>
</head>
