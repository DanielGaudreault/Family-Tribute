<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memorials | Gaudreault Family</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI', Arial, sans-serif;
    background:#f5f7fa;
    color:#333;
}

/* Header */

.header{
    background:#1f2937;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 30px;
    flex-wrap:wrap;
}

.logo a{
    color:white;
    text-decoration:none;
    font-size:30px;
    font-weight:bold;
}

.logo a:hover{
    color:#60a5fa;
}

.nav{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.nav a{
    color:white;
    text-decoration:none;
    padding:10px 16px;
    border-radius:8px;
    transition:.3s;
}

.nav a:hover{
    background:#2563eb;
}

/* Hero */

.hero{
    background:linear-gradient(135deg,#4b5563,#6b7280);
    color:white;
    text-align:center;
    padding:80px 20px;
}

.hero h1{
    font-size:48px;
    margin-bottom:10px;
}

/* Memorial Cards */

.grid{
    max-width:1200px;
    margin:auto;
    padding:50px 20px;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,300px));
    justify-content:center;
    gap:30px;
}

.card{
    display:block;
    background:white;
    color:#333;
    text-decoration:none;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 10px 20px rgba(0,0,0,.15);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card-content{
    padding:20px;
    text-align:center;
}

.card-content h2{
    margin-bottom:10px;
}

.card-content p{
    margin-bottom:8px;
}

footer{
    background:#1f2937;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:40px;
}

</style>
</head>

<body>

<header class="header">

<div class="logo">
<a href="index.html">Gaudreault Family</a>
</div>

<nav class="nav">
<a href="index.html">Home</a>
<a href="family.html">Family</a>
<a href="photos.html">Photos</a>
<a href="events.html">Events</a>
<a href="memorial.html">Memorial</a>
</nav>

</header>

<section class="hero">
<h1>In Loving Memory</h1>
<p>Forever Loved • Forever Remembered</p>
</section>

<div class="grid">

    <!-- Brenda -->

    <a class="card" href="brenda.html">

        <img src="brenda-louise-rosseau.jpg"
             alt="Brenda Louise Rosseau">

        <div class="card-content">
            <h2>Brenda Louise Rosseau</h2>
            <p>July 4, 1961 - September 15, 2024</p>
            <p><strong>Click To View Memorial</strong></p>
        </div>

    </a>

    <!-- Anita -->

    <a class="card" href="anita-pepin.html">

        anita-pepin.jpg

        <div class="card-content">
            <h2>Anita Pépin</h2>
            <p>1939 - 2018</p>
            <p><strong>Click To View Memorial</strong></p>
        </div>

    </a>

</div>

<footer>
Gaudreault Family Memorials
</footer>

</body>
</html>
