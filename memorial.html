<style>

    padding:0;

body{
    font-family:Segoe UI, Arial, sans-serif;
    background:#f5f7fa;
    color:#333;
}

.header{
    background:#1f2937;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 30px;
    flex-wrap:wrap;
}

.logo a{
    color:white;
    text-decoration:none;
    font-size:30px;
    font-weight:bold;
}

.logo a:hover{
    color:#60a5fa;
}

.nav{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.nav a{
    color:white;
    text-decoration:none;
    padding:10px 16px;
    border-radius:8px;
}

.nav a:hover{

    background:#6b7280;
    color:white;
    text-align:center;
    padding:70px 20px;
}

.hero h1{
    font-size:42px;
}

.grid{
    max-width:1000px;
    margin:auto;
    padding:40px 20px;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,300px));
    justify-content:center;
    gap:25px;
}

.card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    text-decoration:none;
    color:#333;
    box-shadow:0 4px 15px rgba(0,0,0,.1);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card-content{
    padding:20px;
    text-align:center;
}

.card-content h2{
    margin-bottom:10px;
}

footer{
    background:#1f2937;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:40px;
}
